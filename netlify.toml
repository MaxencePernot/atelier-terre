[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Ces variables sont PUBLIQUES par conception (l'URL Supabase, la clé "anon"
# protégée par RLS, et la clé publishable Stripe) : elles sont censées se
# trouver dans le site compilé. On les exclut donc du scanner de secrets de
# Netlify. Les vraies clés secrètes (STRIPE_SECRET_KEY,
# SUPABASE_SERVICE_ROLE_KEY) restent, elles, surveillées.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_STRIPE_PUBLISHABLE_KEY"

# Le webhook Stripe a besoin du corps brut : on le route explicitement.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Fallback SPA (doublé de public/_redirects par sécurité).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
