<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9E4DA" />

    <!-- SEO par défaut (surchargé par page via le composant <Seo />) -->
    <title>Atelier Terre — Poteries artisanales faites main</title>
    <meta
      name="description"
      content="Pièces de céramique tournées et émaillées à la main. Vases, bols, tasses et objets uniques façonnés dans notre atelier."
    />
    <link rel="canonical" href="https://atelier-terre.example" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atelier Terre" />
    <meta property="og:title" content="Atelier Terre — Poteries artisanales faites main" />
    <meta property="og:description" content="Céramiques tournées et émaillées à la main dans notre atelier." />
    <meta property="og:image" content="/og-image.jpg" />
    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typographies : Fraunces (display, axe soft/wonky) + Hanken Grotesk (texte) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
